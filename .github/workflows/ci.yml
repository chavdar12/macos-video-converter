name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # gh release create

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      # shortcut: UI tests need a logged-in GUI session and hang on headless runners; run them locally, re-enable on a GUI runner.
      # The memory leak suite runs locally only: on virtual runners live memory jumps by megabytes between
      # conversions, far more than the 32 KB per run it checks for.
      - name: Test
        run: |
          xcodebuild test -project video-converter.xcodeproj -scheme video-converter \
            -destination 'platform=macOS' -skip-testing:video-converterUITests -skip-testing:video-converterTests/MemoryLeakTests -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=""
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: build/Tests.xcresult

  dmg:
    needs: test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] && version_arg="MARKETING_VERSION=${GITHUB_REF_NAME#v}"
          xcodebuild build -project video-converter.xcodeproj -scheme video-converter -configuration Release \
            -derivedDataPath build/DerivedData -destination 'generic/platform=macOS' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM="" ${version_arg:-}
          app=build/DerivedData/Build/Products/Release/video-converter.app
          codesign --verify --deep --strict "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          rm -rf build/dmg && mkdir -p build/dmg && ditto "$app" build/dmg/video-converter.app
          ln -s /Applications build/dmg/Applications
          dmg="build/VideoConverter-$version.dmg"
          hdiutil create -volname "Video Converter" -srcfolder build/dmg -format UDZO -ov "$dmg"
          hdiutil verify "$dmg"
          # Smoke test: the app inside the mounted image is intact and still signed.
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          codesign --verify --deep --strict "$mnt/video-converter.app"
          test -L "$mnt/Applications"
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: build/*.dmg
      - name: Release
        # main or a v* tag on main; never PRs
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then  # releases only come from main
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" -q .status)
            [[ $status == behind || $status == identical ]] || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          fi
          tag="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || tag="v$VERSION.$GITHUB_RUN_NUMBER"
          gh release create "$tag" build/*.dmg --target "$GITHUB_SHA" --generate-notes
