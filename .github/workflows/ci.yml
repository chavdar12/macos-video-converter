name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # gh release create

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          xcodebuild test -project video-converter.xcodeproj -scheme video-converter \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=""
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: build/Tests.xcresult

  dmg:
    needs: test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: brew install create-dmg
      - name: Build DMG
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] && export VERSION="${GITHUB_REF_NAME#v}"
          Scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: build/*.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.dmg --generate-notes
