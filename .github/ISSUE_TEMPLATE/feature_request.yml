name: Feature request
description: Suggest a new format, option or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
